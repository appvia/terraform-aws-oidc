---
name: Terraform
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  role-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@641e8b22034b8eb49e2bbc11ef103d1324eb93e2 # main
    name: OIDC Role Module
    with:
      working-directory: modules/role

  remote-state-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@641e8b22034b8eb49e2bbc11ef103d1324eb93e2 # main
    name: Remote State Module
    with:
      working-directory: modules/remote_state

  provider-validation:
    uses: appvia/appvia-cicd-workflows/.github/workflows/terraform-module-validation.yml@641e8b22034b8eb49e2bbc11ef103d1324eb93e2 # main
    name: Provider Module
    with:
      working-directory: modules/provider
